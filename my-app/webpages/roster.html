    <script>
        document.addEventListener('DOMContentLoaded', () => {
        // 1. DOM Elements
        const searchInput = document.getElementById('search-input');
        const classFilter = document.getElementById('filter-class');
        const positionFilter = document.getElementById('filter-pos');
        const statusFilter = document.getElementById('filter-status');
        const tableBody = document.getElementById('roster-body');
        const newRecruitBtn = document.getElementById('new-recruit-btn');

        // 2. Simulate data coming from an external dependency (API fetch, JSON, etc.)
        // Request data api: const athletesData = await fetch('/api/athletes').then(res => res.json());
        const athletesData = [
            { initials: "MJ", name: "Marcus Johnson", stars: 4, classYear: "2025", position: "Quarterback", status: "Committed" },
            { initials: "SJ", name: "Sarah Jenkins", stars: 2, classYear: "2026", position: "Point Guard", status: "Offered" },
            { initials: "DC", name: "David Chen", stars: 3, classYear: "2025", position: "Midfielder", status: "Evaluating" },
            { initials: "ER", name: "Elena Rodriguez", stars: 4, classYear: "2027", position: "Point Guard", status: "Target" },
            { initials: "JC", name: "Jamal Crawford", stars: 3, classYear: "2026", position: "Quarterback", status: "Target" },
            { initials: "TS", name: "Tyler Smith", stars: 3, classYear: "2025", position: "Quarterback", status: "Evaluating" },
            { initials: "MJ", name: "Tommy Kim", stars: 5, classYear: "2027", position: "Hitter", status: "Committed" },
            { initials: "SJ", name: "Savannah Jenkins", stars: 5, classYear: "2026", position: "Point Guard", status: "Offered" },
            { initials: "DC", name: "Naman Agarwal", stars: 5, classYear: "2027", position: "Computer", status: "Evaluating" },
            { initials: "ER", name: "Khatija Ahmed", stars: 5, classYear: "2027", position: "Hacker :)", status: "Committed" },
            { initials: "JC", name: "Blake Horvath", stars: 5, classYear: "2026", position: "Quarterback", status: "Target" },
            { initials: "TS", name: "Audrey Shu", stars: 5, classYear: "2027", position: "Claude Expert", status: "Offered" }
        ];

        // Helper function to generate styling based on status
        function getStatusStyles(status) {
            const styles = {
                'Committed': 'bg-green-100 text-green-700',
                'Offered': 'bg-blue-100 text-blue-700',
                'Evaluating': 'bg-purple-100 text-purple-700',
                'Target': 'bg-yellow-100 text-yellow-700'
            };
            return styles[status] || 'bg-gray-100 text-gray-700';
        }

        // Helper function to generate stars
        function getStarsHTML(count) {
            let stars = '';
            for(let i=0; i<5; i++) {
                stars += `<i class="fa-${i < count ? 'solid' : 'regular'} fa-star text-yellow-400 text-xs"></i>`;
            }
            return stars;
        }

        // 3. Function to Render the Table based on an array of data
        function renderTable(dataToRender) {
            // Clear out the current table body
            tableBody.innerHTML = '';

            // Loop through the provided data and build HTML for each row
            dataToRender.forEach(athlete => {
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-100 hover:bg-gray-50'; // Add your tailwind classes here
                
                row.innerHTML = `
                    <td class="py-4 px-6 flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm">
                            ${athlete.initials}
                        </div>
                        <div>
                            <div class="font-bold text-gray-800">${athlete.name}</div>
                            <div class="flex gap-1 mt-1">${getStarsHTML(athlete.stars)}</div>
                        </div>
                    </td>
                    <td class="py-4 px-6 text-gray-600 font-medium">${athlete.classYear}</td>
                    <td class="py-4 px-6 text-gray-500">${athlete.position}</td>
                    <td class="py-4 px-6">
                        <span class="px-3 py-1 rounded-full text-sm font-semibold ${getStatusStyles(athlete.status)}">
                            ${athlete.status}
                        </span>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // 4. Function to Filter the Data Array
        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();
            const classValue = classFilter.value.toLowerCase();
            const positionValue = positionFilter.value.toLowerCase();
            const statusValue = statusFilter.value.toLowerCase();

            // Filter the raw data array
            const filteredData = athletesData.filter(athlete => {
                const matchesSearch = searchTerm === '' || athlete.name.toLowerCase().includes(searchTerm);
                
                // Check if dropdown is at default state ('all', 'class year', etc.) or matches the data
                const matchesClass = classValue === 'all' || classValue === 'class year' || athlete.classYear === classValue;
                const matchesPosition = positionValue === 'all' || positionValue === 'position' || athlete.position.toLowerCase() === positionValue;
                const matchesStatus = statusValue === 'all' || statusValue === 'status' || athlete.status.toLowerCase() === statusValue;

                return matchesSearch && matchesClass && matchesPosition && matchesStatus;
            });

            // Re-render the table with the newly filtered array
            renderTable(filteredData);
        }

        // 5. Attach Event Listeners to Inputs
        searchInput.addEventListener('input', applyFilters);
        classFilter.addEventListener('change', applyFilters);
        positionFilter.addEventListener('change', applyFilters);
        statusFilter.addEventListener('change', applyFilters);
        newRecruitBtn.addEventListener('click', () => {
          window.location.href = 'add-recruit.html';
        });

        // 6. Initial Render (Show all athletes on page load)
        renderTable(athletesData);
    });



    </script>
